services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-qa_internship}
      POSTGRES_USER: ${POSTGRES_USER:-qa_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qa_password}
    ports:
      # Bound to loopback so local `npm run dev` can reach the same database
      # compose uses, without publishing Postgres to the network.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-qa_user} -d ${POSTGRES_DB:-qa_internship}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-qa_user}:${POSTGRES_PASSWORD:-qa_password}@postgres:5432/${POSTGRES_DB:-qa_internship}?schema=public
      # Secrets have no defaults on purpose: compose fails loudly if they are
      # unset so a deployment can never run with a publicly-known key.
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:?ADMIN_SESSION_SECRET must be set to a long random value}
      INTERN_SESSION_SECRET: ${INTERN_SESSION_SECRET:?INTERN_SESSION_SECRET must be set to a long random value}
      INVITATION_TOKEN_ENCRYPTION_SECRET: ${INVITATION_TOKEN_ENCRYPTION_SECRET:?INVITATION_TOKEN_ENCRYPTION_SECRET must be set to a long random value}
    ports:
      - "${APP_PORT:-3000}:3000"

volumes:
  postgres-data:
