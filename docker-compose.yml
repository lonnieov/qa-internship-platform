services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-qa_internship}
      POSTGRES_USER: ${POSTGRES_USER:-qa_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qa_password}
    ports:
      # Bound to loopback so local `npm run dev` can reach the same database
      # compose uses, without publishing Postgres to the network.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-qa_user} -d ${POSTGRES_DB:-qa_internship}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-qa_user}:${POSTGRES_PASSWORD:-qa_password}@postgres:5432/${POSTGRES_DB:-qa_internship}?schema=public
      # Secrets have no defaults on purpose: compose fails loudly if they are
      # unset so a deployment can never run with a publicly-known key.
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:?ADMIN_SESSION_SECRET must be set to a long random value}
      INTERN_SESSION_SECRET: ${INTERN_SESSION_SECRET:?INTERN_SESSION_SECRET must be set to a long random value}
      INVITATION_TOKEN_ENCRYPTION_SECRET: ${INVITATION_TOKEN_ENCRYPTION_SECRET:?INVITATION_TOKEN_ENCRYPTION_SECRET must be set to a long random value}
      # Optional AI generation: the app uses only the CLIProxyAPI sidecar.
      # Keep CLI_PROXY_API_KEY unset to disable AI features.
      CLI_PROXY_API_URL: ${CLI_PROXY_API_URL:-http://cli-proxy-api:8317/v1}
      CLI_PROXY_API_KEY: ${CLI_PROXY_API_KEY:-}
      CLI_PROXY_MODEL: ${CLI_PROXY_MODEL:-gpt-5}
    ports:
      - "${APP_PORT:-3000}:3000"

  # AI proxy sidecar (https://github.com/router-for-me/CLIProxyAPI). Exposes an
  # OpenAI/Claude/Gemini-compatible API backed by whatever provider credentials
  # it's configured with, including OAuth logins into an existing Claude
  # Code / Codex CLI subscription instead of a paid API key. Opt-in — it does
  # not start with a plain `docker compose up`:
  #   docker compose --profile ai up -d
  # After the first start, do the one-time OAuth login (see README):
  #   docker compose --profile ai exec cli-proxy-api ./CLIProxyAPI --claude-login --no-browser
  cli-proxy-api:
    image: ${CLI_PROXY_IMAGE:-eceasy/cli-proxy-api:latest}
    container_name: cli-proxy-api
    restart: unless-stopped
    profiles: ["ai"]
    entrypoint: ["/entrypoint.sh"]
    environment:
      # No default on purpose: this key gates every request sent through the
      # proxy, so the sidecar refuses to start without a real secret.
      CLI_PROXY_API_KEY: ${CLI_PROXY_API_KEY:?CLI_PROXY_API_KEY must be set to a long random value}
      # Optional: set to enable the bundled web management panel.
      MANAGEMENT_PASSWORD: ${CLI_PROXY_MANAGEMENT_PASSWORD:-}
    volumes:
      - ./docker/cli-proxy-api/config.base.yaml:/CLIProxyAPI/config.base.yaml:ro
      - ./docker/cli-proxy-api/entrypoint.sh:/entrypoint.sh:ro
      - cli-proxy-auth:/root/.cli-proxy-api
    ports:
      # Loopback-only: the app reaches it over the compose network; local
      # access is for the one-time OAuth login and the management panel.
      - "127.0.0.1:${CLI_PROXY_PORT:-8317}:8317"

volumes:
  postgres-data:
  cli-proxy-auth:
